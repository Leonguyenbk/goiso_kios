{% set _cr = (extra.footer_credit if (extra is defined and extra and extra.footer_credit)
              else 'Phòng Dữ liệu - Thông tin đất đai\nTổ Ứng dụng và Phát triển công nghệ') %}
<div style="position:fixed;left:0;right:0;bottom:0;z-index:60;pointer-events:none;
            text-align:center;font-size:10px;line-height:1.35;padding:2px 8px;
            color:#475569;background:rgba(248,250,252,.82);
            font-family:'Be Vietnam Pro',system-ui,sans-serif;">
  {% for line in _cr.split('\n') %}{{ line }}{% if not loop.last %}<br>{% endif %}{% endfor %}
</div>
