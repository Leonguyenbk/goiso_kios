<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ thống gọi số một cửa — Chọn chi nhánh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Be Vietnam Pro',system-ui,sans-serif}</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-[#0b5fa5] text-white px-6 py-5">
    <div class="max-w-4xl mx-auto">
      <div class="text-lg font-semibold opacity-90">HỆ THỐNG BỐC SỐ &amp; GỌI SỐ MỘT CỬA</div>
      <div class="text-2xl font-extrabold">Chọn chi nhánh</div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6">
    {% if not branches %}
      <p class="text-slate-500">Chưa có chi nhánh nào. Vào <a href="/admin" class="text-[#0b5fa5] underline">trang quản trị</a> để thêm.</p>
    {% endif %}
    <div class="grid sm:grid-cols-2 gap-4">
      {% for b in branches %}
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <div class="font-bold text-lg">{{ b.name }}</div>
        <div class="text-sm text-slate-500 mb-3">{{ b.full_name }}</div>
        <div class="flex flex-wrap gap-2 text-sm">
          <a href="/b/{{ b.code }}/display" class="px-3 py-1.5 rounded-lg bg-[#0b5fa5] text-white">Màn hình</a>
          <a href="/b/{{ b.code }}/counter" class="px-3 py-1.5 rounded-lg border border-slate-300">Bàn gọi số</a>
          <a href="/b/{{ b.code }}/display/simple" class="px-3 py-1.5 rounded-lg border border-slate-300">Màn hình rút gọn</a>
        </div>
      </div>
      {% endfor %}
    </div>
    <div class="mt-8 text-sm">
      <a href="/admin" class="text-[#0b5fa5] underline">Quản trị hệ thống</a>
      &nbsp;·&nbsp;
      <a href="/dat-lich" class="text-[#0b5fa5] underline">Đặt lịch hẹn online</a>
    </div>
  </main>
</body>
</html>
